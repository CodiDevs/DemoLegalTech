<svg xmlns="http://www.w3.org/2000/svg" width="420" height="560" viewBox="0 0 420 560" role="img" aria-labelledby="ldTitle ldDesc">
  <title id="ldTitle">Minuta juridica ficticia</title>
  <desc id="ldDesc">DOCUMENTO FICTICIO - DEMO. Borrador de demostracion, no es una minuta real.</desc>
  <rect width="420" height="560" fill="#faf7f0"/>
