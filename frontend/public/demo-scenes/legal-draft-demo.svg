  <text x="48" y="228" font-family="system-ui, sans-serif" font-size="12" fill="#5c5750">Clausula 2 - Bienes: no se liquidan en este acto.</text>
  <text x="48" y="248" font-family="system-ui, sans-serif" font-size="12" fill="#5c5750">Clausula 3 - Firma electronica de prueba.</text>
