  <text x="48" y="82" font-family="Georgia, serif" font-size="20" fill="#1b1917">Minuta de divorcio</text>
  <text x="48" y="106" font-family="system-ui, sans-serif" font-size="12" fill="#7d786f">Expediente LS-DEMO-014 | Quito</text>
